name: chat
description: "A Flutter WebRTC video calling application."
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # WebRTC - 使用最新兼容版本
  flutter_webrtc: ^1.6.2
  
  # 信令服务
  signalr_netcore: ^1.4.3
  
  # HTTP 请求
  http: ^1.2.2
  crypto: ^3.0.6
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  
  # 数据库
  sqflite: ^2.4.4
  path_provider: ^2.1.4
  
  # 本地存储
  shared_preferences: ^2.5.5
  
  # 权限管理
  # 13.x requires Android compileSdk 37; the Android project and CI now pin API 37.
  permission_handler: ^13.0.2
  
  # 聊天附件选择
  image_picker: ^1.0.7
  image: ^4.10.1
  file_picker: ^13.1.0
  
  # 状态管理
  provider: ^6.1.2
  record: ^7.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/

name: foreverlove-chat

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: ${LIVEKIT_CONTAINER:-foreverlove-chat-livekit}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # The official server reads this as YAML: "api-key: api-secret".
      # These defaults only match appsettings.Development.json. A public server
      # must override them with protected, non-development values.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-livekit-dev-secret-0123456789abcdef}"
      LIVEKIT_RTC_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-false}
      LIVEKIT_RTC_PORT_RANGE_START: ${LIVEKIT_RTC_PORT_MIN:-50000}
      LIVEKIT_RTC_PORT_RANGE_END: ${LIVEKIT_RTC_PORT_MAX:-50100}
      # Docker's 172.* address is not reachable by browser clients. Local web
      # development uses loopback; set the server's public IPv4 in production.
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - type: bind
        source: ./livekit.yaml
        target: /etc/livekit.yaml
        read_only: true
    ports:
      - "${LIVEKIT_BIND_HOST:-0.0.0.0}:${LIVEKIT_PORT:-17880}:7880"
      - "${LIVEKIT_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_TCP_PORT:-17881}:7881/tcp"
      - "${LIVEKIT_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_PORT_MIN:-50000}-${LIVEKIT_RTC_PORT_MAX:-50100}:${LIVEKIT_RTC_PORT_MIN:-50000}-${LIVEKIT_RTC_PORT_MAX:-50100}/udp"
    networks:
      - chat

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:latest}
    container_name: ${POSTGRES_CONTAINER:-foreverlove-chat-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foreverlove_chat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-17132}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foreverlove_chat}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - chat

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${API_IMAGE:-foreverlove-chat-api}:${IMAGE_TAG:-local}
    container_name: ${API_CONTAINER:-foreverlove-chat-api}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:17101
      App__Version: ${APP_VERSION:-1.0.0-local}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-foreverlove_chat};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SecretKey: ${JWT_SECRET:-}
      Jwt__Issuer: ${JWT_ISSUER:-VideoCallAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-VideoCallClient}
      QQ__ClientId: ${QQ__ClientId:-}
      QQ__ClientSecret: ${QQ__ClientSecret:-}
      QQ__RedirectUri: ${QQ__RedirectUri:-https://chat.wangbank.top/qq-callback}
      QQ__AllowMockLogin: ${QQ__AllowMockLogin:-false}
      Admin__Email: ${ADMIN_EMAILS:-}
      Email__SmtpHost: ${Email__SmtpHost:-smtp.qq.com}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__EnableSsl: ${Email__EnableSsl:-true}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromEmail: ${Email__FromEmail:-}
      Email__FromName: ${Email__FromName:-Forever Love}
      Email__PasswordResetBaseUrl: ${Email__PasswordResetBaseUrl:-https://chat.wangbank.top/reset-password}
      Email__PasswordResetTokenMinutes: ${Email__PasswordResetTokenMinutes:-30}
      LiveKit__Url: ${LIVEKIT_PUBLIC_URL:-}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:-}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:-}
      LiveKit__RoomPrefix: ${LIVEKIT_ROOM_PREFIX:-call-}
      LiveKit__TokenTtlMinutes: ${LIVEKIT_TOKEN_TTL_MINUTES:-30}
      Cors__AllowedOrigins__0: ${WEB_PUBLIC_URL:-http://localhost:17102}
      Cors__AllowedOrigins__1: http://localhost:${WEB_PORT:-17102}
      Cors__AllowedOrigins__2: http://127.0.0.1:${WEB_PORT:-17102}
      Cors__AllowedOrigins__3: ${EXTRA_CORS_ORIGIN:-https://chat.wangbank.top}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Security__UseHttpsRedirection: ${USE_HTTPS_REDIRECTION:-false}
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT:-17101}:17101"
    volumes:
      - type: bind
        source: ${API_LOGS_DIR:-./.docker/api/logs}
        target: /app/logs
      - type: bind
        source: ${API_AVATAR_DIR:-./.docker/api/avatar}
        target: /app/avatar
      - type: bind
        source: ${API_CHAT_FILES_DIR:-./.docker/api/chat-files}
        target: /app/chat-files
    networks:
      - chat

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:17101}
        VITE_SIGNALR_HUB_URL: ${SIGNALR_PUBLIC_URL:-http://localhost:17101/videocallhub}
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0-local}
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}
        VCS_REF: ${VCS_REF:-local}
    image: ${WEB_IMAGE:-foreverlove-chat-web}:${IMAGE_TAG:-local}
    container_name: ${WEB_CONTAINER:-foreverlove-chat-web}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:17101}
      # Android artifacts synced from GitHub Releases are served by /download/*.
      DOWNLOADS_DIR: /app/downloads
      APK_FALLBACK_BASE_URL: ${APK_FALLBACK_BASE_URL:-https://github.com/WangBank/chat/releases/latest/download}
    volumes:
      - type: bind
        source: ${WEB_DOWNLOADS_DIR:-./.docker/web/downloads}
        target: /app/downloads
        read_only: true
    depends_on:
      - api
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-17102}:8080"
    networks:
      - chat

networks:
  chat:
    name: ${DOCKER_NETWORK:-foreverlove-chat-net}

volumes:
  postgres_data:

name: Deploy Local Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: local-docker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on local Docker
    runs-on: [self-hosted, Windows, X64, local-docker]
    timeout-minutes: 45

    env:
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '17132' }}
      API_PORT: ${{ vars.API_PORT || '17101' }}
      WEB_PORT: ${{ vars.WEB_PORT || '17102' }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
      SIGNALR_PUBLIC_URL: ${{ vars.SIGNALR_PUBLIC_URL }}
      EXTRA_CORS_ORIGIN: ${{ vars.EXTRA_CORS_ORIGIN || 'https://chat.wangbank.top' }}
      SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED || 'false' }}
      USE_HTTPS_REDIRECTION: ${{ vars.USE_HTTPS_REDIRECTION || 'false' }}
      QQ__ClientId: ${{ secrets.QQ_CLIENT_ID }}
      QQ__ClientSecret: ${{ secrets.QQ_CLIENT_SECRET }}
      QQ__RedirectUri: ${{ vars.QQ_REDIRECT_URI || 'https://chat.wangbank.top/qq-callback' }}
      QQ__AllowMockLogin: ${{ vars.QQ_ALLOW_MOCK_LOGIN || 'false' }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS || vars.ADMIN_EMAILS }}
      Email__SmtpHost: ${{ vars.EMAIL_SMTP_HOST || 'smtp.qq.com' }}
      Email__SmtpPort: ${{ vars.EMAIL_SMTP_PORT || '587' }}
      Email__EnableSsl: ${{ vars.EMAIL_ENABLE_SSL || 'true' }}
      Email__Username: ${{ vars.EMAIL_USERNAME }}
      Email__Password: ${{ secrets.EMAIL_PASSWORD }}
      Email__FromEmail: ${{ vars.EMAIL_FROM_EMAIL || vars.EMAIL_USERNAME }}
      Email__FromName: ${{ vars.EMAIL_FROM_NAME || 'Forever Love' }}
      Email__PasswordResetBaseUrl: ${{ vars.EMAIL_PASSWORD_RESET_BASE_URL || 'https://chat.wangbank.top/reset-password' }}
      Email__PasswordResetTokenMinutes: ${{ vars.EMAIL_PASSWORD_RESET_TOKEN_MINUTES || '30' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        shell: powershell
        run: |
          $baseVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $appVersion = "$baseVersion+$env:GITHUB_RUN_NUMBER.$shortSha"
          $imageTag = ($appVersion -replace '[^A-Za-z0-9_.-]', '-').Trim('.', '-', '_')
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "IMAGE_TAG=$imageTag" >> $env:GITHUB_ENV
          "VCS_REF=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "Resolved version $appVersion"

      - name: Show Docker environment
        shell: powershell
        run: |
          docker --version
          docker compose version
          docker info

      - name: Deploy to local Docker
        shell: powershell
        run: |
          ./scripts/deploy-local.ps1 `
            -AppVersion "$env:APP_VERSION" `
            -ImageTag "$env:IMAGE_TAG"

      - name: Deployment summary
        shell: powershell
        run: |
          $api = if ($env:API_PUBLIC_URL) { $env:API_PUBLIC_URL } else { "http://localhost:$env:API_PORT" }
          $web = if ($env:WEB_PUBLIC_URL) { $env:WEB_PUBLIC_URL } else { "http://localhost:$env:WEB_PORT" }
          @(
            "### Forever Love Chat deployment",
            "",
            "- Version: ``$env:APP_VERSION``",
            "- Image tag: ``$env:IMAGE_TAG``",
            "- Website: $web",
            "- API: $api",
            "- Flutter API: ``$api/api``",
            "- Flutter SignalR: ``$api/videocallhub``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
